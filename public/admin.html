<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA TV - لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #030f07; font-family: 'Tajawal', sans-serif; color: white; min-height: 100vh; }
        .liquid-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .25; animation: move 20s ease-in-out infinite; }
        .blob-1 { width: 500px; height: 500px; background: radial-gradient(circle, #00ff88, transparent); top: -120px; right: -120px; }
        .blob-2 { width: 400px; height: 400px; background: radial-gradient(circle, #00b85c, transparent); bottom: -100px; left: -100px; animation-delay: -5s; }
        @keyframes move { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(50px,-50px) scale(1.15); } }
        .glass { background: rgba(10,30,20,.45); backdrop-filter: blur(20px); border: 1px solid rgba(0,255,130,.15); border-radius: 22px; }
        .input { width: 100%; padding: 12px 16px; background: rgba(10,30,20,.6); border: 1px solid rgba(0,255,130,.2); border-radius: 12px; color: white; outline: none; }
        .btn { border: none; border-radius: 12px; padding: 10px 18px; font-weight: 800; cursor: pointer; transition: .25s; }
        .btn-green { background: linear-gradient(135deg,#00ff88,#00b85c); color: #001a0d; }
        .btn-gray { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); color: white; }
        .btn-red { background: linear-gradient(135deg,#ff0040,#b8002b); color: white; }
        .hidden { display: none !important; }
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.85); backdrop-filter: blur(8px); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
    </style>
</head>
<body>

<div class="liquid-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
</div>

<div id="login-screen" class="min-h-screen flex items-center justify-center p-6 relative z-10">
    <div class="glass p-8 w-full max-w-md text-center">
        <div class="text-5xl mb-4">🔐</div>
        <div class="text-3xl font-black mb-2">⚽ FIFA<span class="text-green-400">TV</span></div>
        <p class="text-gray-400 text-sm mb-6">لوحة التحكم</p>
        <input id="password" type="password" class="input mb-4 text-center" placeholder="كلمة السر" onkeydown="if(event.key==='Enter') login()">
        <button onclick="login()" class="btn btn-green w-full">🔓 دخول</button>
        <div id="login-error" class="hidden mt-4 text-red-400 text-sm">⚠️ كلمة السر خاطئة</div>
    </div>
</div>

<div id="dashboard" class="hidden max-w-5xl mx-auto p-5 relative z-10">
    <nav class="glass p-5 flex justify-between items-center mb-6">
        <div class="text-2xl font-black">⚽ FIFA<span class="text-green-400">TV</span></div>
        <div class="flex gap-2">
            <button onclick="loadMatches(currentDay)" class="btn btn-green text-sm">🔄 تحديث</button>
            <button onclick="logout()" class="btn btn-red text-sm">🚪 خروج</button>
        </div>
    </nav>
    <div id="matches-list" class="space-y-3"></div>
</div>

<div id="stream-modal" class="modal-bg hidden">
    <div class="glass p-6 w-full max-w-2xl">
        <h3 id="modal-match-title" class="text-lg font-black text-green-400 mb-4"></h3>
        <div id="streams-container" class="space-y-3 mb-6"></div>
        <div class="flex justify-between">
            <button onclick="addStreamRow()" class="btn btn-gray text-xs">➕ إضافة سيرفر</button>
            <button onclick="saveStreams()" class="btn btn-green text-xs">💾 حفظ البث</button>
        </div>
        <button onclick="closeModal()" class="mt-4 text-gray-400 text-xs w-full text-center">إغلاق</button>
    </div>
</div>

<script>
let currentDay = "today";
let currentMatches = [];
let activeMatchId = null;

function getSavedPassword() { return sessionStorage.getItem("admin_password") || ""; }

async function login() {
    const pass = document.getElementById("password").value;
    const res = await fetch("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pass }) });
    const data = await res.json();
    if (data.success) { sessionStorage.setItem("admin_password", pass); showDashboard(); }
    else { document.getElementById("login-error").classList.remove("hidden"); }
}

function showDashboard() { document.getElementById("login-screen").classList.add("hidden"); document.getElementById("dashboard").classList.remove("hidden"); loadMatches(currentDay); }
function logout() { sessionStorage.removeItem("admin_password"); location.reload(); }

async function loadMatches(day) {
    const res = await fetch("/api/matches?day=" + day);
    const data = await res.json();
    currentMatches = data.matches || [];
    document.getElementById("matches-list").innerHTML = currentMatches.map(m => `
        <div class="glass p-4 flex justify-between items-center">
            <div><div class="text-sm font-bold">${m.home} vs ${m.away}</div><div class="text-xs text-gray-400">${m.streams.length} سيرفرات</div></div>
            <button onclick="openModal('${m.id}')" class="btn btn-green text-xs">⚙️ إدارة البث</button>
        </div>
    `).join("");
}

function openModal(id) {
    activeMatchId = id;
    const match = currentMatches.find(m => String(m.id) === String(id));
    document.getElementById("modal-match-title").textContent = match.home + " vs " + match.away;
    document.getElementById("streams-container").innerHTML = "";
    if (match.streams.length === 0) addStreamRow("سيرفر 1", "");
    else match.streams.forEach(s => addStreamRow(s.name, s.url));
    document.getElementById("stream-modal").classList.remove("hidden");
}

function addStreamRow(name, url) {
    const div = document.createElement("div");
    div.className = "flex gap-2";
    div.innerHTML = `<input type="text" class="input stream-name w-1/3 text-xs" value="${name}"> <input type="text" class="input stream-url w-2/3 text-xs" value="${url}">`;
    document.getElementById("streams-container").appendChild(div);
}

async function saveStreams() {
    const streams = Array.from(document.querySelectorAll("#streams-container > div")).map(div => ({
        name: div.querySelector(".stream-name").value,
        url: div.querySelector(".stream-url").value
    })).filter(s => s.url);

    await fetch("/api/admin/streams", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: getSavedPassword(), matchId: activeMatchId, streams })
    });
    closeModal(); loadMatches(currentDay); alert("✅ تم الحفظ");
}

function closeModal() { document.getElementById("stream-modal").classList.add("hidden"); }
if (getSavedPassword()) showDashboard();
</script>
</body>
</html>
