<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - الصفحة غير موجودة | Hassani E.com</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#08060F">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-section {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 1rem;
        }
        .error-code {
            font-size: clamp(5rem, 15vw, 9rem);
            font-weight: 900;
            line-height: 1;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #FFFFFF 0%, #00E676 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .error-title { font-size: 1.8rem; margin-bottom: 1rem; color: #FFF; }
        .error-desc { color: var(--white-60); max-width: 500px; margin: 0 auto 2.5rem; font-size: 1.05rem; }
    </style>
</head>
<body>

    <div class="bg-blobs"><div class="blob blob-1"></div></div>
    <div class="bg-grid"></div>

    <nav class="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="brand">
                <span class="brand-name">Hassani<span class="brand-accent"> E.com</span></span>
            </a>
        </div>
    </nav>

    <main class="error-section">
        <div class="container">
            <div class="error-code">404</div>
            <h1 class="error-title">عذراً، الصفحة التي تبحث عنها غير موجودة</h1>
            <p class="error-desc">يبدو أن الرابط الذي سلكته غير صحيح أو تم نقل الصفحة إلى عنوان آخر.</p>
            <a href="index.html" class="btn btn-primary">
                العودة للصفحة الرئيسية
            </a>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Hassani E.com — صُنع للمتاجر المغاربة</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/security.js"></script>
</body>
</html>
