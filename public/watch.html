<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المباراة | Hassani TV</title>
    <meta name="description" content="تعرف على نتيجة وتفاصيل المباراة الحالية على موقع Hassani TV.">
    <meta name="robots" content="index, follow">
    
    <!-- Server-Side Dynamic Canonical Tag Placeholder -->
    <!-- CANONICAL_TAG -->
    
    <!-- Google AdSense Auto Ads Script Only -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6541657840288379" crossorigin="anonymous"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-base: #0b1220; --bg-surface: #0a110d; --text-main: #ffffff; --text-muted: #94a3b8; --primary: #00c853; --glass-border: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg-base); color: var(--text-main); min-height: 100vh; }
        a { text-decoration: none; color: inherit; }
        
        /* Unified Navigation */
        header { position: sticky; top: 0; z-index: 50; background: rgba(11,18,32,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border); }
        .nav { width: min(1100px, 92%); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; min-height: 72px; flex-wrap: wrap; padding: 10px 0; }
        .logo { font-size: 24px; font-weight: 900; } .logo span { color: var(--primary); }
        .menu { display: flex; gap: 14px; flex-wrap: wrap; }
        .menu a { color: var(--text-muted); font-weight: 700; font-size: 14px; padding: 4px 0; transition: color 0.3s; }
        .menu a:hover, .menu a.active { color: var(--primary); }

        main { max-width: 900px; margin: 0 auto; padding: 40px 15px; }

        .match-info { background: var(--bg-surface); border: 1px solid var(--glass-border); border-radius: 16px; padding: 30px; text-align: center; margin-bottom: 30px; }
        .match-teams { display: flex; justify-content: space-around; align-items: center; margin-bottom: 20px; }
        .team img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 10px; }
        .team h2 { font-size: 18px; color: #fff; }
        .score { font-size: 36px; font-weight: 900; }
        .league { color: var(--primary); font-weight: 800; font-size: 14px; margin-bottom: 20px; }

        .player-container { background: #000; border-radius: 12px; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; border: 1px solid var(--glass-border); margin-bottom: 20px; flex-direction: column; padding: 20px; text-align: center;}
        .player-container h3 { margin-bottom: 10px; color: var(--text-muted); }

        .seo-text { background: var(--bg-surface); border: 1px solid var(--glass-border); border-radius: 12px; padding: 20px; line-height: 1.8; color: var(--text-muted); }
        .seo-text h3 { color: #fff; margin-bottom: 10px; }

        .loader { width: 40px; height: 40px; border: 3px solid var(--glass-border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 40px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        footer { border-top: 1px solid var(--glass-border); padding: 32px 0; color: var(--text-muted); text-align: center; margin-top: 40px; }
        footer .links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
        footer a { color: var(--text-muted); font-weight: 700; font-size: 14px; transition: color 0.3s;}
        footer a:hover { color: var(--primary); }
        
        @media (max-width: 700px) { 
            .nav { flex-direction: column; gap: 12px; justify-content: center; } 
            .menu { justify-content: center; font-size: 13px; } 
            .team img { width: 50px; height: 50px; } 
            .score { font-size: 24px; } 
        }
    </style>
</head>
<body>
    <header>
        <div class="nav">
            <a class="logo" href="/">Hassani<span>TV</span></a>
            <nav class="menu">
                <a href="/">الرئيسية</a>
                <a class="active" href="/site">المباريات</a>
                <a href="/about">من نحن</a>
                <a href="/contact">اتصل بنا</a>
                <a href="/privacy">سياسة الخصوصية</a>
                <a href="/terms">الشروط والأحكام</a>
            </nav>
        </div>
    </header>

    <main id="content-container">
        <div class="loader"></div>
    </main>

    <footer>
        <div class="links">
            <a href="/">الرئيسية</a>
            <a href="/site">المباريات</a>
            <a href="/about">من نحن</a>
            <a href="/contact">اتصل بنا</a>
            <a href="/privacy">سياسة الخصوصية</a>
            <a href="/terms">الشروط والأحكام</a>
        </div>
        <p>© 2026 Hassani TV — المحتوى الرياضي الموثوق</p>
    </footer>

    <script>
        // XSS Protection Helper for DOM Rendering
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>'"]/g, function(tag) {
                const charsToReplace = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                };
                return charsToReplace[tag] || tag;
            });
        }

        async function loadMatchDetails() {
            const params = new URLSearchParams(window.location.search);
            const matchId = params.get('id');
            const container = document.getElementById('content-container');

            if (!matchId) {
                container.innerHTML = '<div class="match-info"><h2>عذراً، لم يتم العثور على المباراة المطلوبة أو المعرف غير صحيح.</h2><br><a href="/site" style="color:var(--primary);">العودة لجدول المباريات</a></div>';
                return;
            }

            try {
                const res = await fetch(`/api/match/${encodeURIComponent(matchId)}`);
                const data = await res.json();

                if (!data.success || !data.match) {
                    const safeError = escapeHTML(data.error) || 'المباراة غير متوفرة حالياً';
                    container.innerHTML = `<div class="match-info"><h2>${safeError}</h2><br><a href="/site" style="color:var(--primary);">العودة لجدول المباريات</a></div>`;
                    return;
                }

                const m = data.match;
                
                // Sanitize all API inputs
                const safeHome = escapeHTML(m.home);
                const safeAway = escapeHTML(m.away);
                const safeLeague = escapeHTML(m.league);
                const safeMainText = escapeHTML(m.mainText);
                const safePillText = escapeHTML(m.pillText);
                
                // Safe Image URLs
                const safeHomeLogo = escapeHTML(m.homeLogo);
                const safeAwayLogo = escapeHTML(m.awayLogo);

                // Update Dynamic Page Title & Meta Description
                document.title = `${safeHome} ضد ${safeAway} | Hassani TV`;
                const descMeta = document.querySelector('meta[name="description"]');
                if (descMeta) {
                    descMeta.setAttribute('content', `تعرف على نتيجة وتوقيت مباراة ${safeHome} ضد ${safeAway} ضمن منافسات ${safeLeague} على موقع Hassani TV.`);
                }

                // Stream display logic
                let streamHtml = '<div class="player-container"><h3>تفاصيل المباراة</h3><p>تتوفر هنا معلومات النتيجة والتوقيت الخاصة بهذه المباراة.</p></div>';
                if (m.streams && m.streams.length > 0) {
                    streamHtml = `<div class="player-container"><h3>تحديثات المباراة</h3><p>تم إدراج تحديثات ومصادر إضافية لهذه المباراة.</p></div>`;
                }

                // Render Content
                container.innerHTML = `
                    <div class="match-info">
                        <div class="league">🏆 ${safeLeague}</div>
                        <div class="match-teams">
                            <div class="team">
                                <img src="${safeHomeLogo}" alt="شعار فريق ${safeHome}">
                                <h2>${safeHome}</h2>
                            </div>
                            <div class="score">
                                <div>${safeMainText}</div>
                                <div style="font-size:14px; color:var(--text-muted); font-weight:normal;">${safePillText}</div>
                            </div>
                            <div class="team">
                                <img src="${safeAwayLogo}" alt="شعار فريق ${safeAway}">
                                <h2>${safeAway}</h2>
                            </div>
                        </div>
                    </div>
                    
                    ${streamHtml}

                    <div class="seo-text">
                        <h3>عن هذه المباراة</h3>
                        <p>تُعرض في هذه الصفحة المعلومات المتاحة حول مباراة <strong>${safeHome}</strong> ضد <strong>${safeAway}</strong> في إطار منافسات <strong>${safeLeague}</strong>. نحرص في Hassani TV على تحديث حالة المباراة (سواء توقيت الانطلاق أو النتيجة الحالية) فور توفرها لتقديم خدمة دقيقة للزوار.</p>
                    </div>
                `;
            } catch (e) {
                container.innerHTML = '<div class="match-info"><h2>حدث خطأ في الاتصال بالخادم. يرجى المحاولة لاحقاً.</h2><br><a href="/site" style="color:var(--primary);">العودة لجدول المباريات</a></div>';
            }
        }

        loadMatchDetails();
    </script>
</body>
</html>
