            --card: #121a2b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #00c853;
            --border: rgba(255,255,255,0.08);

        * { box-sizing: border-box; margin: 0; padding: 0; }

        a { color: inherit; text-decoration: none; }
        .container { width: min(860px, 92%); margin: 0 auto; }
        header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(11,18,32,0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .nav {
            width: min(1100px, 92%); margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
            min-height: 72px;
        }
        .logo { font-size: 24px; font-weight: 900; }
        .logo span { color: var(--primary); }
        .menu { display: flex; gap: 18px; flex-wrap: wrap; }
        .menu a { color: var(--muted); font-weight: 700; font-size: 14px; }

        .article-wrap { padding: 36px 0 60px; }
        .tag {
            display: inline-block;
            background: rgba(0,200,83,.12);
            color: var(--primary);

            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 14px;

        .meta { color: #64748b; font-size: 14px; font-weight: 700; margin-bottom: 22px; }
        .ad-box {
            margin: 24px 0;
            min-height: 90px;
            border: 1px dashed var(--border);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            color: var(--muted); font-size: 12px; font-weight: 700;
            background: rgba(255,255,255,0.02);
            overflow: hidden;
        }
        .content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px;
        }
        .content p { color: #dbe4f0; margin-bottom: 18px; font-size: 18px; }
        .content h2 { font-size: 24px; margin: 26px 0 12px; }
        .back {
            display: inline-block;

            color: var(--primary);

            padding: 28px 0 40px;
            color: var(--muted);
            text-align: center;

        footer .links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
        footer a { color: var(--muted); font-weight: 700; font-size: 14px; }

const articles = {
    "1": {
        tag: "دوري الأبطال",

            + "<h2>لماذا الوسط هو مفتاح المرحلة؟</h2>"
            + "<p>التحول السريع من الدفاع إلى الهجوم، وتنظيم الإيقاع، واستعادة الكرة في مناطق متقدمة، كلها عناصر تعتمد على توازن لاعبي الارتكاز وصناع اللعب. أي خلل بسيط قد يفتح ثغرات قاتلة أمام الخصوم المنظمين.</p>"
            + adBlock
            + "<p>من الناحية التكتيكية، تحتاج الفرق الكبرى إلى خيارات متعددة: لاعب يضبط الإيقاع، وآخر يكسر الخطوط، وثالث يغطّي المساحات عند فقدان الكرة. هذا العمق هو ما يفرق بين فريق ينافس وبين فريق يحسم.</p>"
            + "<h2>ما الذي يجب مراقبته؟</h2>"
            + "<p>الحالة البدنية، توزيع الدقائق، والانضباط الدفاعي عند الانتقالات العكسية. التفاصيل الصغيرة في وسط الملعب غالبا ما تصنع الفارق في الليالي الأوروبية الكبرى.</p>"
    },
    "2": {
        tag: "البطولة الاحترافية",
        title: "الوداد والرجاء: كلاسيكو مغربي يعيد رسم سباق اللقب",

            + "<h2>سباق اللقب تحت المجهر</h2>"
            + "<p>عندما تتقارب النقاط، تتحول كل ثنائية إلى فرصة استراتيجية. الضغط الجماهيري، إدارة المرتدات، والثبات الذهني تصبح عوامل حاسمة بقدر جودة اللاعبين.</p>"
            + adBlock
            + "<p>في مثل هذه المباريات، لا يكفي الاستحواذ فقط. المهم هو كيفية استغلال اللحظات الحاسمة، والثبات بعد الأهداف، والقراءة الصحيحة لإيقاع اللعب خلال الشوط الثاني.</p>"
    },
    "3": {
        tag: "بريميرليغ",
        title: "مانشستر سيتي يعيد ضبط الإيقاع الدفاعي بعد سلسلة نتائج متباينة",
        meta: "تحليل · 7 دقائق قراءة",
        html:
            "<p>حتى أقوى الفرق تمر بفترات تحتاج فيها إلى إعادة ضبط التفاصيل الدفاعية. مانشستر سيتي يواجه هذا التحدي عبر التركيز على التمركز، والضغط المنسق، وتقليل المساحات بين الخطوط.</p>"
            + "<p>النتائج المتباينة لا تعني بالضرورة أزمة هوية، لكنها مؤشر على الحاجة لتوازن أفضل بين السيطرة والصلابة. في البريميرليغ، التفاصيل الصغيرة تقرر الكثير.</p>"
            + adBlock
            + "<p>الرحلة المقبلة ستكشف ما إذا كان التصحيح الدفاعي سريعا وثابتا، أم أنه يحتاج وقتا أطول قبل استعادة الإيقاع الكامل.</p>"
    },
    "4": {
        tag: "سوق الانتقالات",
        title: "كيف تبني الأندية الكبرى خطط التعاقدات في يناير؟",
        meta: "مقال معمق · 9 دقائق قراءة",
        html:
            "<p>لم يعد سوق يناير مجرد محاولة متأخرة لترميم العيوب. الأندية الكبرى تتعامل معه كجزء من خطة موسمية تعتمد على البيانات والتقييم المستمر لأداء اللاعبين.</p>"
            + "<h2>معايير الصفقة الناجحة</h2>"
            + "<p>الجاهزية الفورية، ملاءمة الأسلوب التكتيكي، وتوازن الرواتب. أي تعاقد لا يحترم هذه العناصر قد يتحول إلى عبء بدل أن يكون حلا.</p>"
            + adBlock

            + adBlock
            + "<p>النجومية الفردية عنصر قوة، غير أن البناء الجماعي هو ما يحول السيطرة إلى ألقاب.</p>"
    },
    "6": {

const params = new URLSearchParams(window.location.search);
